# SPIRE server and agent, after the upstream Kubernetes quickstart. The server
# is the certificate authority for the trust domain; the agent runs on every
# node, attests workloads by their Kubernetes service account, and hands each
# one its identity over a Unix socket.
apiVersion: v1
kind: Namespace
metadata: { name: spire }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: spire-server, namespace: spire }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: spire-bundle, namespace: spire }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: spire-server-trust-role }
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: spire-server-trust-role-binding }
subjects: [{ kind: ServiceAccount, name: spire-server, namespace: spire }]
roleRef: { kind: ClusterRole, name: spire-server-trust-role, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: spire-server-configmap-role, namespace: spire }
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["patch", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: spire-server-configmap-role-binding, namespace: spire }
subjects: [{ kind: ServiceAccount, name: spire-server, namespace: spire }]
roleRef: { kind: Role, name: spire-server-configmap-role, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: spire-server, namespace: spire }
data:
  server.conf: |
    server {
      bind_address = "0.0.0.0"
      bind_port = "8081"
      socket_path = "/tmp/spire-server/private/api.sock"
      trust_domain = "example.org"
      data_dir = "/run/spire/data"
      log_level = "INFO"
      ca_key_type = "ec-p256"
      # Short on purpose: rotation has to happen several times inside one run
      # for the rotation claim to be tested rather than assumed.
      default_x509_svid_ttl = "2m"
      ca_ttl = "24h"
    }
    plugins {
      DataStore "sql" {
        plugin_data {
          database_type = "sqlite3"
          connection_string = "/run/spire/data/datastore.sqlite3"
        }
      }
      NodeAttestor "k8s_psat" {
        plugin_data {
          clusters = { "scp-identity" = { service_account_allow_list = ["spire:spire-agent"] } }
        }
      }
      KeyManager "memory" { plugin_data {} }
      Notifier "k8sbundle" { plugin_data { namespace = "spire" } }
    }
    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: spire-server, namespace: spire, labels: { app: spire-server } }
spec:
  replicas: 1
  selector: { matchLabels: { app: spire-server } }
  serviceName: spire-server
  template:
    metadata: { namespace: spire, labels: { app: spire-server } }
    spec:
      serviceAccountName: spire-server
      containers:
        - name: spire-server
          image: ghcr.io/spiffe/spire-server:1.15.3
          args: ["-config", "/run/spire/config/server.conf"]
          ports: [{ containerPort: 8081 }]
          volumeMounts:
            - { name: spire-config, mountPath: /run/spire/config, readOnly: true }
            - { name: spire-data, mountPath: /run/spire/data }
          livenessProbe:
            httpGet: { path: /live, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - { name: spire-config, configMap: { name: spire-server } }
        - { name: spire-data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: spire-server, namespace: spire }
spec:
  type: ClusterIP
  selector: { app: spire-server }
  ports: [{ name: grpc, port: 8081, targetPort: 8081, protocol: TCP }]
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: spire-agent, namespace: spire }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: spire-agent-cluster-role }
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: spire-agent-cluster-role-binding }
subjects: [{ kind: ServiceAccount, name: spire-agent, namespace: spire }]
roleRef: { kind: ClusterRole, name: spire-agent-cluster-role, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: spire-agent, namespace: spire }
data:
  agent.conf: |
    agent {
      data_dir = "/run/spire"
      log_level = "INFO"
      server_address = "spire-server"
      server_port = "8081"
      socket_path = "/run/spire/sockets/agent.sock"
      trust_bundle_path = "/run/spire/bundle/bundle.crt"
      trust_domain = "example.org"
    }
    plugins {
      NodeAttestor "k8s_psat" { plugin_data { cluster = "scp-identity" } }
      KeyManager "memory" { plugin_data {} }
      # kind's kubelet serves a self-signed certificate; verifying it would
      # need the kind CA mounted in. The attestation itself still comes from
      # the kubelet's view of which pod owns the calling process.
      WorkloadAttestor "k8s" { plugin_data { skip_kubelet_verification = true } }
    }
    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: spire-agent, namespace: spire, labels: { app: spire-agent } }
spec:
  selector: { matchLabels: { app: spire-agent } }
  template:
    metadata: { namespace: spire, labels: { app: spire-agent } }
    spec:
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: spire-agent
      initContainers:
        - name: init
          image: cgr.dev/chainguard/wait-for-it
          args: ["-t", "60", "spire-server:8081"]
      containers:
        - name: spire-agent
          image: ghcr.io/spiffe/spire-agent:1.15.3
          args: ["-config", "/run/spire/config/agent.conf"]
          volumeMounts:
            - { name: spire-config, mountPath: /run/spire/config, readOnly: true }
            - { name: spire-bundle, mountPath: /run/spire/bundle }
            - { name: spire-agent-socket, mountPath: /run/spire/sockets, readOnly: false }
            - { name: spire-token, mountPath: /var/run/secrets/tokens }
          livenessProbe:
            httpGet: { path: /live, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - { name: spire-config, configMap: { name: spire-agent } }
        - { name: spire-bundle, configMap: { name: spire-bundle } }
        - { name: spire-agent-socket, hostPath: { path: /run/spire/sockets, type: DirectoryOrCreate } }
        - name: spire-token
          projected:
            sources:
              - serviceAccountToken: { path: spire-agent, expirationSeconds: 7200, audience: spire-server }
